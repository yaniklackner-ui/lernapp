<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#C8102E">
<title>Lern-App FF Ebelsberg</title>
<style>
:root{--red:#C8102E;--bg:#F4F3F1;--surface:#fff;--text:#1C1917;--muted:#625E5A;--line:#E3E0DC}
@media (prefers-color-scheme: dark){:root{--red:#E0334D;--bg:#141211;--surface:#1F1C1A;--text:#F2EFEC;--muted:#A9A39D;--line:#36312D}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
header{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;font-weight:700;font-size:17px}
header span{display:block;font-weight:400;font-size:13px;opacity:.9}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;width:100%;max-width:380px}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 16px;color:var(--muted);font-size:14px}
input{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--red);outline-offset:1px}
label.rem{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:14px;color:var(--muted)}
label.rem input{width:auto}
button{margin-top:16px;width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;border:0;border-radius:10px;background:var(--red);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;margin:10px 0 0;min-height:1em}
</style>
</head>
<body>
<header>Lern-App<span>FF Ebelsberg</span></header>
<main>
<form id="f" autocomplete="off">
  <h1>Zugang</h1>
  <p>Die Lern-App ist für Mitglieder der FF Ebelsberg. Bitte gib das Passwort ein.</p>
  <input id="pw" type="password" placeholder="Passwort" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label class="rem"><input id="rem" type="checkbox" checked> Auf diesem Gerät merken</label>
  <button id="go" type="submit">Öffnen</button>
  <div class="err" id="err" role="alert"></div>
</form>
</main>

async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:u8(SALT), iterations:ITER}, base, 512));
  const iv = u8(IV), ct = u8(DATA), msg = new Uint8Array(iv.length + ct.length); msg.set(iv); msg.set(ct, iv.length);
  const mk = await crypto.subtle.importKey("raw", bits.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  if (!await crypto.subtle.verify("HMAC", mk, u8(TAG), msg)) return null;
  const ek = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC", iv}, ek, ct));
}
